<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador para o Aniversário</title>
    <link rel="stylesheet" href="./styles/main.css">
</head>
<body>
    <div class="container">
        <h1>Contagem Regressiva para o Meu Aniversário!</h1>
        <div class="contador">
            <div class="tempo"><span id="dias"></span> Dias</div>
            <div class="tempo"><span id="horas"></span> Horas</div>
            <div class="tempo"><span id="minutos"></span> Minutos</div>
            <div class="tempo"><span id="segundos"></span> Segundos</div>
        </div>
        <div class="info-container">
            <p><strong>Local:</strong> Minha Casa</p>
            <p><strong>Horário:</strong> 18:00</p>
            <button id="confirmarPresenca">Confirmar Presença</button>
        </div>
    </div>
    <script src="./scripts/main.js"></script>
</body>
</html>
